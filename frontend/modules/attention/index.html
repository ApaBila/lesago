<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perhatian - lesago</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../modules.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body id="page-attention">
    <header>
        <div class="header-title" style="cursor: pointer;" onclick="window.location.href='../../index.html'">lesago</div>
        <div id="auth-container">
            <div id="user-info" class="hidden">
                <span id="user-name"></span>
                <button id="logout-button">Keluar</button>
            </div>
            <button id="login-button">Masuk dengan Google</button>
        </div>
    </header>

    <div class="module-container">
        <h1 class="content-block">Model III: Pola Perhatian (Attention Patterns)</h1>

        <div class="explanation-container content-block">
            <h2>Melihat ke Dalam Pikiran Model</h2>
            <p>Pola-pola ini mengungkapkan "algoritma" yang telah dipelajari model. Pilih prompt dan lapisan yang berbeda untuk dijelajahi.</p>
        </div>

        <div id="controls-container" class="content-block">
            <div class="control-group">
                <strong>Pilih Prompt:</strong>
                <button class="control-btn active" data-prompt="prompt1">Induction</button>
                <button class="control-btn" data-prompt="prompt2">Repeated Token</button>
            </div>
            <div class="control-group">
                <strong>Pilih Lapisan:</strong>
                <button class="control-btn" data-layer="0">Early Layer (0)</button>
                <button class="control-btn" data-layer="1">Mid Layer (1)</button> 
            </div>
        </div>

        <div id="vis-container" class="content-block"></div>
    </div>

    <footer>
        <img src="../../lesago_logo.png" alt="Lesago Logo" class="footer-logo">
    </footer>
    
    <script type="module" src="../../main.js"></script>
    <script type="module" src="attention-visualizer.js"></script>
</body>
</html>
